<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>StudyPlan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Bố cục: thanh trên cùng như bảng thời gian đua; trang chủ có hero kèm bản đồ đường đua; trang bài học chia hai cột (mục lục dính bên trái); trò chơi là khung dọc có bảng xếp hạng bên cạnh. */
:root{
  --bg:#E6E9EE; --surface:#FFFFFF; --surface-2:#F1F3F7; --ink:#14171C; --ink-2:#4F5665; --line:#CDD2DB;
  --paint:#FFC400; --paint-ink:#14171C; --kerb:#D6342B; --kerb-w:#FFFFFF; --em-ink:#14171C; --hl:#FFC400;
  --asphalt:#1A1D23; --asphalt-2:#272B33; --on-asphalt:#EDEFF3; --on-asphalt-2:#B4BAC6;
  --good:#0C7A44; --good-soft:#D6F0E2; --bad:#B3261E; --bad-soft:#FADDD9;
  --info:#1B5FCB; --info-soft:#DBE7FA; --warn:#7F5200; --warn-soft:#FCEBC2; --violet:#5B34C4; --violet-soft:#E6DEF9;
  --shadow:0 1px 2px rgba(20,23,28,.07),0 10px 28px rgba(20,23,28,.06);
  --f-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1014; --surface:#171A20; --surface-2:#20242C; --ink:#EDEFF3; --ink-2:#A2A9B7; --line:#2C313B;
  --kerb:#FF5B4F; --kerb-w:#E9EBEF; --asphalt:#1A1D23; --asphalt-2:#272B33; --em-ink:#FFC400; --hl:transparent;
  --good:#4CD694; --good-soft:#123226; --bad:#FF8277; --bad-soft:#3D1F1C;
  --info:#7DAEFF; --info-soft:#15284A; --warn:#F2BB4C; --warn-soft:#3A2C0E; --violet:#B79BFF; --violet-soft:#2A2050;
  --shadow:0 0 0 rgba(0,0,0,0); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#171A20; --surface-2:#20242C; --ink:#EDEFF3; --ink-2:#A2A9B7; --line:#2C313B;
  --kerb:#FF5B4F; --kerb-w:#E9EBEF; --asphalt:#1A1D23; --asphalt-2:#272B33; --em-ink:#FFC400; --hl:transparent;
  --good:#4CD694; --good-soft:#123226; --bad:#FF8277; --bad-soft:#3D1F1C;
  --info:#7DAEFF; --info-soft:#15284A; --warn:#F2BB4C; --warn-soft:#3A2C0E; --violet:#B79BFF; --violet-soft:#2A2050;
  --shadow:0 0 0 rgba(0,0,0,0); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--asphalt);z-index:60}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:4px}
.top :focus-visible,.asphalt :focus-visible{outline-color:var(--paint)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-2)} .small{font-size:14px} .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:700 13px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*,.grid>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.kerb{height:7px;background:repeating-linear-gradient(90deg,var(--kerb) 0 18px,var(--kerb-w) 18px 36px)}

/* Thanh trên cùng */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--asphalt);color:var(--on-asphalt)}
.top-in{display:flex;align-items:center;gap:24px;min-height:56px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;color:#fff;white-space:nowrap}
.logo svg{width:34px;height:34px;flex:none}
.logo i{font-style:italic;color:var(--paint)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-left:auto}
.nav::-webkit-scrollbar{display:none}
.nav a{color:var(--on-asphalt-2);text-decoration:none;font:700 16px/1 var(--f-display);letter-spacing:.07em;text-transform:uppercase;padding:19px 12px 16px;white-space:nowrap;border-bottom:3px solid transparent}
.nav a:hover{color:#fff}
.nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--paint)}
@media (max-width:760px){.top-in{flex-wrap:wrap;gap:0;padding-top:8px}.nav{margin-left:0;width:100%}.nav a{padding:12px 10px 10px}}

/* Nút và thẻ nhỏ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border:2px solid var(--ink);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;font:700 18px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--paint);color:var(--paint-ink);border-color:#14171C;box-shadow:0 3px 0 #14171C}
.btn.sm{padding:7px 12px;font-size:15px;box-shadow:0 2px 0 var(--ink)}
.btn.lg{padding:15px 26px;font-size:21px}
.btn.ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);transform:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font:600 13px/1.4 var(--f-body);background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)} .chip.no{background:var(--bad-soft);color:var(--bad)}
.chip.paint{background:var(--paint);color:var(--paint-ink)} .chip.info{background:var(--info-soft);color:var(--info)}
.plate{display:inline-grid;place-items:center;min-width:54px;padding:2px 10px 0;background:#fff;color:#14171C;border:3px solid #14171C;border-radius:8px;font:italic 800 34px/1.1 var(--f-display);letter-spacing:.02em}
.plate.sm{min-width:38px;font-size:22px;border-width:2px;border-radius:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none} .card.soft{background:var(--surface-2);border-color:transparent;box-shadow:none}

/* Trang chủ */
.hero{padding-block:44px 52px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{font-weight:800;font-size:clamp(46px,8.4vw,92px);line-height:1.12;text-transform:uppercase;margin:14px 0 18px}
.hero h1 em{font-style:italic;color:var(--em-ink);background:linear-gradient(transparent 62%,var(--hl) 62% 94%,transparent 94%);padding:0 4px;margin:0 -4px}
.lede{font-size:18px;color:var(--ink-2);max-width:56ch}
.cta-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
.hero-meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.hero-meta b{display:block;font:800 34px/1 var(--f-display)} .hero-meta span{font-size:13px;color:var(--ink-2)}
.track-card{background:var(--asphalt);color:var(--on-asphalt);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.track-card .cap{display:flex;justify-content:space-between;gap:10px;padding:14px 18px;font:700 14px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--on-asphalt-2)}
.track-card svg{display:block;width:100%;height:auto}
.sec{padding-block:48px}
.sec.alt{background:var(--surface);border-block:1px solid var(--line)}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:26px;max-width:68ch}
.sec-head h2{font-size:clamp(32px,5vw,48px);font-weight:800;line-height:1.14;text-transform:uppercase}
.stages{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stage{display:flex;flex-direction:column;gap:12px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.stage h3{font-size:26px;font-weight:700;line-height:1.12}
.stage ul{margin:0;padding-left:18px;color:var(--ink-2);font-size:15px}
.stage .btn{margin-top:auto;align-self:flex-start}
.flow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));list-style:none;margin:0;padding:0;counter-reset:f}
.flow li{counter-increment:f;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:6px}
.flow li::before{content:counter(f);font:italic 800 30px/1 var(--f-display);color:var(--ink)}
.flow b{font:700 20px/1.15 var(--f-display)} .flow span{font-size:14px;color:var(--ink-2)}
.goals{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.goals .card{padding:18px}
.goals h4{font-size:21px;font-weight:700;margin-bottom:6px}
.foot{background:var(--asphalt);color:var(--on-asphalt-2);margin-top:40px;font-size:14px}
.foot-in{padding-block:26px;display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap}
.foot b{color:#fff}
@media (max-width:860px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero{padding-block:28px 36px}}

/* Trang bài học */
.lesson{display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px;padding-block:30px 20px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:18px;max-height:calc(100vh - 96px);overflow:auto}
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.stepper a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:15px;line-height:1.25}
.stepper a:hover{background:var(--surface-2);color:var(--ink)}
.stepper a[aria-current="step"]{background:var(--asphalt);color:#fff}
.stepper .sn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:800 17px/1 var(--f-display);background:var(--surface-2);color:var(--ink)}
.stepper a[aria-current="step"] .sn{background:var(--paint);color:var(--paint-ink)}
.stepper small{display:block;font-weight:500;font-size:12px;opacity:.75}
.toc{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--line);padding-left:4px}
.toc a{padding:6px 10px;font-size:14px;color:var(--ink-2);text-decoration:none;border-radius:6px;line-height:1.35}
.toc a:hover{color:var(--ink);background:var(--surface-2)}
.rail h4{font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:6px}
.rail details>summary{cursor:pointer;font:700 13px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);list-style:none;padding:4px 0}
.lh{display:flex;gap:18px;align-items:flex-start;margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.lh h1{font-size:clamp(34px,5.4vw,54px);font-weight:800;line-height:1.14;text-transform:uppercase}
.lh p{margin-top:8px;color:var(--ink-2);max-width:62ch}
.prose{max-width:70ch}
.prose>*+*{margin-top:14px}
.topic{padding-bottom:34px;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px)}
.topic>h2{font-size:clamp(28px,4vw,38px);font-weight:800;line-height:1.1;margin-bottom:14px}
.topic h3{font-size:23px;font-weight:700;margin-top:22px}
.prose ul,.prose ol{padding-left:22px;margin-block:0}
.prose li+li{margin-top:6px}
.prose table{border-collapse:collapse;width:100%;font-size:15px}
.prose th,.prose td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top}
.prose th{background:var(--surface-2);font:700 16px var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.tw{overflow-x:auto}
.callout{border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.callout b.t{font:800 15px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.callout.ex{background:var(--info-soft);color:var(--ink)} .callout.ex b.t{color:var(--info)}
.callout.more{background:var(--violet-soft)} .callout.more b.t{color:var(--violet)}
.callout.tip{background:var(--warn-soft)} .callout.tip b.t{color:var(--warn)}
.callout.warn{background:var(--bad-soft)} .callout.warn b.t{color:var(--bad)}
.callout .src{font-size:13px;color:var(--ink-2)}
.fig{margin:6px 0;max-width:640px}
.fig svg{display:block;width:100%;height:auto}
.fig figcaption{font-size:13px;color:var(--ink-2);margin-top:6px}
.dg-t{fill:var(--ink)} .dg-t2{fill:var(--ink-2)} .dg-line{stroke:var(--line)} .dg-box{fill:var(--surface-2);stroke:var(--line)}
.smartstrip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:70ch}
.smartstrip div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 8px;text-align:center}
.smartstrip b{display:block;font:italic 800 34px/1 var(--f-display)} .smartstrip span{display:block;font-weight:600;font-size:13px;line-height:1.25;margin-top:4px}
.smartstrip small{display:block;font-size:12px;color:var(--ink-2);margin-top:4px;line-height:1.3}
@media (max-width:560px){.smartstrip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{display:flex;gap:4px;max-width:70ch;align-items:stretch}
.tl span{display:grid;place-items:center;min-height:44px;border-radius:5px;font:700 15px var(--f-display);letter-spacing:.04em;padding:0 2px;text-align:center}
.tl .w{background:var(--asphalt);color:#fff} .tl .r{background:var(--paint);color:var(--paint-ink)} .tl .l{background:var(--good-soft);color:var(--good)}
.nextbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:12px;padding:18px;border:2px dashed var(--line);border-radius:10px;max-width:70ch}
@media (max-width:900px){
  .lesson{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:18px}
  .rail{position:static;max-height:none;overflow:visible;gap:10px}
  .stepper{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .stepper a{white-space:nowrap;border:1px solid var(--line);padding:8px 12px}
  .stepper small{display:none}
  .toc{border-left:0;padding-left:0}
  .lh{flex-direction:column;gap:10px}
}

/* Bài thực hành và kiểm tra nhanh */
.pr{display:flex;flex-direction:column;gap:14px;max-width:760px}
.pr+.pr{margin-top:18px}
.pr h3{font-size:26px;font-weight:700;line-height:1.15}
.pr .intro{color:var(--ink-2);font-size:15px}
.qrow{display:flex;flex-direction:column;gap:9px;padding-top:14px;border-top:1px dashed var(--line)}
.qrow:first-of-type{border-top:0;padding-top:0}
.qrow>p{font-weight:600}
.cats,.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts.col{flex-direction:column}
.opt{display:flex;align-items:flex-start;gap:10px;text-align:left;padding:9px 13px;border:2px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600;font-size:15px;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--ink);background:var(--surface-2)}
.opt.correct{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.opt input{margin-top:4px;accent-color:var(--ink)}
.fb{font-size:14.5px;padding:10px 13px;border-radius:8px;line-height:1.5}
.fb.ok{background:var(--good-soft);color:var(--good)} .fb.no{background:var(--bad-soft);color:var(--bad)}
.fb b{font-weight:700}
.qc{max-width:70ch;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.qc .eyebrow{color:var(--ink)}

/* Cuộc đua */
.race{display:grid;gap:22px;grid-template-columns:minmax(0,1fr) minmax(300px,410px);grid-template-areas:"pit cv" "opts cv" "tw cv" "help cv";grid-template-rows:auto auto auto 1fr;align-items:start}
.pit{grid-area:pit} .cvw{grid-area:cv;position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px)} .gopts{grid-area:opts} .tower{grid-area:tw} .help{grid-area:help}
@media (max-width:900px){.race{grid-template-columns:minmax(0,1fr);grid-template-areas:"pit" "cv" "opts" "tw" "help";grid-template-rows:auto}.cvw{position:static;max-width:440px;margin-inline:auto;width:100%}}
.asphalt{background:var(--asphalt);color:var(--on-asphalt)}
.pit{border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:178px}
.pit .hd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pit .hd .no{font:800 22px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--paint)}
.pit .hd .sc{margin-left:auto;font:700 15px var(--f-mono);color:var(--on-asphalt-2)}
.pit .q{font-size:19px;line-height:1.45;font-weight:600;color:#fff}
.pit .chip{background:var(--asphalt-2);color:var(--on-asphalt)}
.gbar{height:8px;border-radius:99px;background:var(--asphalt-2);overflow:hidden}
.gbar i{display:block;height:100%;width:100%;background:var(--paint);transform-origin:left;transition:none}
.verdict{display:flex;flex-direction:column;gap:8px}
.verdict .v{font:800 28px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.verdict .v.ok{color:#5BE39C} .verdict .v.no{color:#FF8A80}
.verdict p{font-size:15.5px;line-height:1.5;color:var(--on-asphalt)}
.gopts{display:flex;flex-direction:column;gap:8px}
.gopt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:11px 13px;background:var(--surface);border:2px solid var(--line);border-radius:8px;cursor:pointer;font-size:15px;font-weight:500;line-height:1.4}
.gopt .lt{flex:none;width:30px;height:30px;border-radius:6px;display:grid;place-items:center;font:800 20px/1 var(--f-display);color:#14171C}
.gopt:hover:not([disabled]){border-color:var(--ink)}
.gopt.on{border-color:var(--ink);box-shadow:inset 6px 0 0 var(--paint);background:var(--surface-2)}
.gopt.good{background:var(--good-soft);border-color:var(--good)} .gopt.bad{background:var(--bad-soft);border-color:var(--bad)}
.gopt[disabled]{cursor:default}
.lane0{background:#FFC400} .lane1{background:#52B6FF} .lane2{background:#C69BFF} .lane3{background:#FF9A57}
.cv{position:relative;border-radius:12px;overflow:hidden;background:var(--asphalt);box-shadow:var(--shadow)}
.cv canvas{display:block;width:100%;aspect-ratio:360/450;touch-action:pan-y;background:#20242C}
.cv-ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(14,16,20,.82);text-align:center}
.cv-ov .box{display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px;color:#fff}

/* Chuyển Markdown đơn giản (tiêu đề ##, gạch đầu dòng, bảng, **đậm**) sang HTML */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function mdToHtml(md) {
  const lines = md.split("\n"), out = []; let i = 0;
  while (i < lines.length) {
    const L = lines[i];
    if (!L.trim() || L.startsWith("# ")) { i++; continue; }
    if (L.startsWith("## ")) { out.push("<h3>" + inl(L.slice(3)) + "</h3>"); i++; continue; }
    if (L.startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i].replace(/^\||\|$/g, "").split("|").map(c => c.trim())); i++; }
      const head = rows.shift();
      out.push("<div class=\"tw\"><table><thead><tr>" + head.map(c => "<th>" + inl(c) + "</th>").join("") + "</tr></thead><tbody>" + rows.map(r => "<tr>" + r.map(c => "<td>" + inl(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>"); continue;
    }
    if (L.startsWith("- ")) {
      const it = []; while (i < lines.length && lines[i].startsWith("- ")) { it.push("<li>" + inl(lines[i].slice(2)) + "</li>"); i++; }
      out.push("<ul>" + it.join("") + "</ul>"); continue;
    }
    out.push("<p>" + inl(L) + "</p>"); i++;
  }
  return out.join("");
}

FIG.curve = () => {
  const X0 = 64, X1 = 612, Y0 = 40, Y1 = 212;
  const X = t => X0 + (X1 - X0) * t / 14, Y = r => Y1 - (Y1 - Y0) * r;
  const build = (times, s0, mult) => {
    let d = "";
    for (let k = 0; k < times.length - 1; k++) {
      const a = times[k], b = times[k + 1], s = s0 * Math.pow(mult, k);
      for (let t = a; t <= b + 1e-9; t += 0.25) d += (d ? "L" : "M") + X(t).toFixed(1) + " " + Y(Math.exp(-(t - a) / s)).toFixed(1) + " ";
    }
    return d;
  };
  const A = build([0, 14], 2.2, 1), B = build([0, 1, 3, 7, 14], 2.2, 2.5);
  const ticks = [0, 1, 3, 7, 14].map(t => "<text x=\"" + X(t).toFixed(1) + "\" y=\"232\" text-anchor=\"middle\" class=\"dg-t2\" style=\"font:600 13px var(--f-mono)\">" + t + "</text>").join("");
  const dots = [1, 3, 7].map(t => "<circle cx=\"" + X(t).toFixed(1) + "\" cy=\"" + Y(1).toFixed(1) + "\" r=\"4.5\" style=\"fill:var(--surface);stroke:var(--info);stroke-width:2\"/>").join("");
  const yl = [[1, "100%"], [0.5, "50%"], [0, "0%"]].map(p => "<text x=\"54\" y=\"" + (Y(p[0]) + 4).toFixed(1) + "\" text-anchor=\"end\" class=\"dg-t2\" style=\"font:600 13px var(--f-mono)\">" + p[1] + "</text><line x1=\"" + X0 + "\" x2=\"" + X1 + "\" y1=\"" + Y(p[0]).toFixed(1) + "\" y2=\"" + Y(p[0]).toFixed(1) + "\" class=\"dg-line\" stroke-width=\"1\"" + (p[0] === 0 ? "" : " stroke-dasharray=\"2 4\"") + "/>").join("");
  return "<svg viewBox=\"0 0 640 272\" role=\"img\" aria-label=\"Đường quên minh họa: không ôn lại thì phần nhớ giảm gần về 0 sau 14 ngày; ôn lại ở ngày 1, 3 và 7 thì phần nhớ giảm chậm hơn mỗi lần\">" +
    yl + "<g fill=\"none\" stroke-linejoin=\"round\" stroke-linecap=\"round\">" +
    "<path d=\"" + A + "\" style=\"stroke:var(--ink-2)\" stroke-width=\"2\" stroke-dasharray=\"6 5\"/>" +
    "<path d=\"" + B + "\" style=\"stroke:var(--info)\" stroke-width=\"2.5\"/></g>" + dots + ticks +

    "<line x1=\"214\" x2=\"242\" y1=\"16\" y2=\"16\" style=\"stroke:var(--info)\" stroke-width=\"2.5\"/><text x=\"248\" y=\"20\" class=\"dg-t\" style=\"" + T2 + "\">Ôn lại ở ngày 1, 3 và 7 (vòng tròn)</text></svg>";

  const fb = () => { const a = document.createElement("textarea"); a.value = t; a.style.cssText = "position:fixed;opacity:0;top:0"; document.body.appendChild(a); a.select(); let ok = false; try { ok = document.execCommand("copy"); } catch (e) {} a.remove(); toast(ok ? "Đã sao chép." : "Không sao chép được. Hãy bôi đen và nhấn Ctrl+C."); };

    "<section class=\"sec\"><div class=\"wrap\"><div class=\"sec-head\"><span class=\"eyebrow\">Chọn bài học</span><h2>Ba chặng, đi theo thứ tự</h2></div><div class=\"stages\">" +
    CH.map(c => "<article class=\"stage\"><div class=\"row\"><span class=\"plate\">" + c.no + "</span><span class=\"chip\">" + c.min + " phút</span><span class=\"chip\">" + c.topics.length + " mục · " + c.practice.length + " bài tập · " + c.quiz.length + " câu đua</span></div><h3>" + c.title + "</h3><p class=\"muted small\">" + c.goal + "</p><ul>" + c.topics.map(t => "<li>" + t.title + "</li>").join("") + "</ul><button class=\"btn primary\" data-act=\"go\" data-to=\"" + c.hash + "\">Vào chặng " + c.id + "</button></article>").join("") + "</div></div></section>" +
    "<section class=\"sec alt\"><div class=\"wrap\"><div class=\"sec-head\"><span class=\"eyebrow\">Cách học trên StudyPlan</span><h2>Mỗi chặng đi qua sáu bước</h2></div><ol class=\"flow\">" + flow.map(f => "<li><b>" + f[0] + "</b><span>" + f[1] + "</span></li>").join("") + "</ol></div></section>" +
    "<section class=\"sec\"><div class=\"wrap\"><div class=\"card row\" style=\"justify-content:space-between\"><div><h3 style=\"font-size:28px\">Thư viện tài liệu học tập</h3><p class=\"muted\">Mẫu SWOT, SMART, kế hoạch tuần, phiếu góp ý, bảng thuật ngữ và danh sách nguồn tham khảo.</p></div><button class=\"btn\" data-act=\"go\" data-to=\"thu-vien\">Mở thư viện</button></div></div></section>";
}
ACT.scrollTo = el => { const t = $("#" + el.dataset.id); if (t) t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); };

/* ----- Thư viện tài liệu ----- */
function Library() {
  return "<div class=\"wrap\" style=\"padding-block:34px 20px\"><header class=\"lh\" style=\"flex-direction:column;gap:10px\"><span class=\"eyebrow\">Thư viện</span><h1>Tài liệu học tập</h1><p>Các mẫu bạn có thể xem, sao chép hoặc tải về để dùng khi tự lập kế hoạch. Bấm “Xem” để mở nội dung.</p></header>" +
    "<div class=\"docs\">" + DOCS.map(d => {
      const open = S.doc === d.id;
      return "<article class=\"doc\"><div class=\"doc-h\"><div class=\"tt\"><h3>" + d.title + "</h3><p>" + d.desc + "</p></div><div class=\"row\"><button class=\"btn sm\" data-act=\"docOpen\" data-id=\"" + d.id + "\" aria-expanded=\"" + open + "\">" + (open ? "Đóng" : "Xem") + "</button><button class=\"btn sm ghost\" data-act=\"docCopy\" data-id=\"" + d.id + "\">Sao chép</button>" + (DL ? "<button class=\"btn sm ghost\" data-act=\"docSave\" data-id=\"" + d.id + "\">Tải về</button>" : "") + "</div></div>" +
        (open ? "<div class=\"doc-b\"><div class=\"md\">" + mdToHtml(d.md) + "</div></div>" : "") + "</article>";
    }).join("") + "</div>" +
    "<div class=\"sec-head\" style=\"margin-top:44px\"><span class=\"eyebrow\">Hình và sơ đồ</span><h2 style=\"font-size:34px;font-weight:800\">Sơ đồ nhanh</h2></div>" +
    "<div class=\"grid\" style=\"grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))\">" + ["swot", "matrix", "loop", "curve"].map(k => "<figure class=\"fig card flat\" style=\"margin:0;max-width:none\">" + FIG[k]() + "</figure>").join("") + "</div>" +
    "<p class=\"muted small\" style=\"margin-top:10px;max-width:70ch\">Đường quên chỉ là hình minh họa cho ý tưởng ôn tập cách quãng, không phải số liệu đo được.</p>" +
    "<div class=\"sec-head\" style=\"margin-top:44px\"><span class=\"eyebrow\">Nguồn tham khảo</span><h2 style=\"font-size:34px;font-weight:800\">Kiến thức mở rộng đến từ đâu</h2><p class=\"muted small\">Nguồn có liên kết đã được đối chiếu với trang gốc khi soạn nội dung. Các nguồn còn lại là tài liệu kinh điển, chưa được mở lại bản gốc; hãy kiểm tra trước khi trích dẫn trong bài nộp.</p></div>" +
    "<ol class=\"srcs\">" + Object.keys(SRC).map(k => "<li>" + esc(SRC[k].t) + (SRC[k].u ? " <a href=\"" + SRC[k].u + "\" target=\"_blank\" rel=\"noopener\">" + SRC[k].ul + "</a>" : "") + "</li>").join("") + "</ol></div>";
}
ACT.docOpen = el => { S.doc = S.doc === el.dataset.id ? null : el.dataset.id; render(); };
const docOf = id => DOCS.find(d => d.id === id);
ACT.docCopy = el => copyText(docOf(el.dataset.id).md);
ACT.docSave = el => {
  const d = docOf(el.dataset.id); if (!DL) return;
  DL.save({ filename: "studyplan-" + d.id + ".md", data: d.md }).then(() => toast("Đã lưu tài liệu."), e => { if (!e || e.code !== "declined") toast("Không tải về được trong cửa sổ này. Hãy dùng nút Sao chép."); });
};

/* ----- Hoàn thành khóa học ----- */
function Finish() {
  const done = CH.filter(c => S.res[c.id]), all = done.length === CH.length;
  const total = done.reduce((n, c) => n + S.res[c.id].score, 0), avg = done.length ? Math.round(total / done.length) : 0;
  const cards = CH.map(c => { const r = S.res[c.id]; return "<div class=\"card\"><span class=\"eyebrow\">Chặng " + c.id + " · " + c.short + "</span>" + (r ? "<b>" + r.score + "<small style=\"font-size:.4em\"> / 100</small></b><span class=\"chip " + (r.rank === 1 ? "paint" : "") + "\">Hạng " + r.rank + " · " + r.correct + "/" + r.total + " câu đúng</span><div class=\"row\"><button class=\"btn sm\" data-act=\"go\" data-to=\"" + c.hash + "-ket-qua\">Xem lời giải</button><button class=\"btn sm ghost\" data-act=\"go\" data-to=\"" + c.hash + "-kiem-tra\">Đua lại</button></div>" : "<b>Chưa đua</b><span class=\"muted small\">Chặng này chưa có kết quả trong phiên này.</span><button class=\"btn sm primary\" data-act=\"go\" data-to=\"" + c.hash + "\">Vào chặng " + c.id + "</button>") + "</div>"; }).join("");
  return "<div class=\"wrap\" style=\"padding-block:34px 20px\"><section class=\"fin asphalt\"><div><span class=\"eyebrow\" style=\"color:var(--on-asphalt-2)\">" + (all ? "Hoàn thành khóa học" : "Gần về đích") + "</span><h1>" + (all ? "Về <em>đích</em>!" : "Còn <em>" + (CH.length - done.length) + "</em> chặng") + "</h1>" +
    "<p>" + (all ? "Bạn đã đi hết ba chặng với điểm trung bình " + avg + "/100. Sự thay đổi lớn bắt đầu từ những thói quen nhỏ mỗi ngày." : "Hoàn thành cả ba chặng để kết thúc khóa học. Bạn có thể đua theo thứ tự bất kỳ.") + "</p></div>" + trophySVG() + "</section>" +
    "<div class=\"scoreline\" style=\"margin-top:22px\">" + cards + "</div>" +
    "<section class=\"card\" style=\"margin-top:22px;max-width:820px\"><h3 style=\"font-size:30px;margin-bottom:10px\">Ba việc nên làm ngay hôm nay</h3><ol class=\"prose\" style=\"padding-left:22px\"><li>Điền bảng SWOT cá nhân, mỗi ô ít nhất hai ý.</li><li>Viết ba mục tiêu SMART: học tập, kỹ năng, ngoại khóa.</li><li>Lập kế hoạch tuần tới theo ma trận ưu tiên, có khối tự học 25/5 và ít nhất một khối dự phòng.</li></ol>" +
    "<div class=\"row\" style=\"margin-top:14px\"><button class=\"btn primary\" data-act=\"go\" data-to=\"thu-vien\">Mở mẫu trong thư viện</button><button class=\"btn ghost\" data-act=\"go\" data-to=\"trang-chu\">Về trang chủ</button></div></section>" +
    "<p class=\"muted small\" style=\"margin-top:14px\">StudyPlan không có tài khoản và không lưu điểm của bạn. Tải lại trang là bắt đầu lại từ đầu.</p></div>";
}
/* ===== Trang bài học, bài thực hành, kết quả ===== */
const STEPS = [["doc", "", "Đọc kiến thức", "Khởi động"], ["thuc-hanh", "-thuc-hanh", "Thực hành", "Chạy thử"], ["kiem-tra", "-kiem-tra", "Kiểm tra", "Đua chính"], ["ket-qua", "-ket-qua", "Kết quả", "Bục nhận giải"]];
const QREG = {};
const co = (cls, t, txt, src) => "<div class=\"callout " + cls + "\"><b class=\"t\">" + t + "</b><p>" + rich(txt) + "</p>" + (src ? "<span class=\"src\">" + src + "</span>" : "") + "</div>";

function quick(key, q) {
  QREG[key] = q; const a = S.chk[key], done = a !== undefined;
  return "<div class=\"qc\" data-card=\"qc\" data-k=\"" + key + "\"><span class=\"eyebrow\">Kiểm tra nhanh</span><p><b>" + q.q + "</b></p><div class=\"opts col\">" +
    q.o.map((o, i) => "<button class=\"opt" + (done && i === q.a ? " correct" : "") + (done && i === a && a !== q.a ? " wrong" : "") + "\" data-act=\"qc\" data-k=\"" + key + "\" data-i=\"" + i + "\"" + (done ? " disabled" : "") + ">" + o + "</button>").join("") + "</div>" +
    (done ? "<div class=\"fb " + (a === q.a ? "ok" : "no") + "\" role=\"status\"><b>" + (a === q.a ? "Chính xác." : "Chưa đúng.") + "</b> " + q.why + "</div>" : "") + "</div>";
}
ACT.qc = el => { S.chk[el.dataset.k] = +el.dataset.i; const old = el.closest("[data-card=qc]"); old.outerHTML = quick(el.dataset.k, QREG[el.dataset.k]); };

function blk(n, tp, bi, b) {
  const k = b[0];
  if (k === "p") return "<p>" + rich(b[1]) + "</p>";
  if (k === "h3") return "<h3>" + b[1] + "</h3>";
  if (k === "ul" || k === "ol") return "<" + k + ">" + b[1].map(x => "<li>" + rich(x) + "</li>").join("") + "</" + k + ">";
  if (k === "ex") return co("ex", "Ví dụ", b[1]);
  if (k === "tip") return co("tip", "Mẹo", b[1]);
  if (k === "warn") return co("warn", "Lưu ý", b[1]);
  if (k === "more") return co("more", "Kiến thức mở rộng", b[1], "Nguồn: " + (b[2] || []).map(key => { const s = SRC[key]; return !s ? "" : s.u ? "<a href=\"" + s.u + "\" target=\"_blank\" rel=\"noopener\">" + s.s + "</a>" : s.s; }).join("; ") + ". Danh sách đầy đủ trong Thư viện.");
  if (k === "fig") return "<figure class=\"fig\">" + FIG[b[1]]() + "<figcaption>" + b[2] + "</figcaption></figure>";
  if (k === "html") return b[1];
  if (k === "table") return "<div class=\"tw\"><table><thead><tr>" + b[1].map(h => "<th>" + h + "</th>").join("") + "</tr></thead><tbody>" + b[2].map(r => "<tr>" + r.map(c => "<td>" + rich(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>";
  if (k === "go") return "<div><button class=\"btn sm\" data-act=\"go\" data-to=\"" + b[2] + "\">" + b[1] + "</button></div>";
  if (k === "check") return quick(n + "." + tp + "." + bi, b[1]);
  return "";
}
const nextBar = (txt, to, label) => "<div class=\"nextbar\"><span>" + txt + "</span><button class=\"btn primary\" data-act=\"go\" data-to=\"" + to + "\">" + label + "</button></div>";

/* ----- Bài thực hành ----- */
function practiceHTML(n, i) {
  const c = CH[n - 1], p = c.practice[i], k = n + "." + i, st = S.prac[k] || (S.prac[k] = {});
  const d = "data-n=\"" + n + "\" data-i=\"" + i + "\"";
  let h = "<section class=\"card pr\" id=\"pr-" + i + "\" data-card=\"pr\" " + d + "><span class=\"eyebrow\">Bài " + (i + 1) + " trên " + c.practice.length + "</span><h3>" + p.title + "</h3><p class=\"intro\">" + rich(p.intro) + "</p>";
  const reset = "<button class=\"btn sm ghost\" data-act=\"prReset\" " + d + ">Làm lại</button>";
  const fb = (ok, why) => "<div class=\"fb " + (ok ? "ok" : "no") + "\" role=\"status\"><b>" + (ok ? "Chính xác." : "Chưa đúng.") + "</b> " + why + "</div>";
  if (p.t === "sort") {
    const a = st.a || (st.a = {}), cnt = Object.keys(a).length, ok = Object.keys(a).filter(j => a[j] === p.items[j][1]).length;
    h += p.items.map((it, j) => {
      const sel = a[j], done = sel !== undefined;
      return "<div class=\"qrow\"><p>" + (j + 1) + ". " + it[0] + "</p><div class=\"cats\">" + p.cats.map((cat, ci) => "<button class=\"opt" + (done && ci === it[1] ? " correct" : "") + (done && ci === sel && sel !== it[1] ? " wrong" : "") + "\" data-act=\"sortPick\" " + d + " data-j=\"" + j + "\" data-c=\"" + ci + "\"" + (done ? " disabled" : "") + ">" + cat + "</button>").join("") + "</div>" + (done ? fb(sel === it[1], it[2]) : "") + "</div>";
    }).join("") + "<div class=\"row\"><span class=\"chip " + (cnt === p.items.length ? "ok" : "") + "\">Đã làm " + cnt + "/" + p.items.length + " · đúng " + ok + "</span>" + (cnt ? reset : "") + "</div>";
  } else if (p.t === "choice") {
    const pick = st.pick, done = pick !== undefined;
    h += "<p><b>" + p.q + "</b></p><div class=\"opts col\">" + p.o.map((o, j) => "<button class=\"opt" + (done && j === p.a ? " correct" : "") + (done && j === pick && pick !== p.a ? " wrong" : "") + "\" data-act=\"chPick\" " + d + " data-j=\"" + j + "\"" + (done ? " disabled" : "") + ">" + o + "</button>").join("") + "</div>" + (done ? fb(pick === p.a, p.why) + "<div>" + reset + "</div>" : "");
  } else {
    const sel = st.sel || (st.sel = []), done = !!st.done, okAll = sel.length === p.a.length && p.a.every(x => sel.includes(x));
    h += "<p><b>" + p.q + "</b></p><div class=\"opts col\">" + p.o.map((o, j) => { const on = sel.includes(j), ok = p.a.includes(j); return "<label class=\"opt" + (done && ok ? " correct" : "") + (done && on && !ok ? " wrong" : "") + (!done && on ? " sel" : "") + "\"><input type=\"checkbox\" data-act=\"multiTog\" " + d + " data-j=\"" + j + "\"" + (on ? " checked" : "") + (done ? " disabled" : "") + "><span>" + o + "</span></label>"; }).join("") + "</div>" +
      (done ? fb(okAll, p.why) + "<div>" + reset + "</div>" : "<div><button class=\"btn sm primary\" data-act=\"multiGo\" " + d + ">Kiểm tra</button></div>");
  }
  return h + "</section>";
}
const repaint = el => { const n = +el.dataset.n, i = +el.dataset.i; $("#pr-" + i).outerHTML = practiceHTML(n, i); };
const pst = el => S.prac[el.dataset.n + "." + el.dataset.i] || (S.prac[el.dataset.n + "." + el.dataset.i] = {});
ACT.sortPick = el => { const st = pst(el); (st.a || (st.a = {}))[el.dataset.j] = +el.dataset.c; repaint(el); };
ACT.chPick = el => { pst(el).pick = +el.dataset.j; repaint(el); };
ACT.multiTog = el => { const st = pst(el), j = +el.dataset.j, s = st.sel || (st.sel = []); const x = s.indexOf(j); if (el.checked && x < 0) s.push(j); if (!el.checked && x >= 0) s.splice(x, 1); el.closest("label").classList.toggle("sel", el.checked); };
ACT.multiGo = el => { const st = pst(el); if (!(st.sel || []).length) { toast("Hãy chọn ít nhất một đáp án."); return; } st.done = true; repaint(el); };
ACT.prReset = el => { delete S.prac[el.dataset.n + "." + el.dataset.i]; repaint(el); };
ACT.toc = (el, e) => { e.preventDefault(); const t = $("#" + el.dataset.id); if (t) t.scrollIntoView({ behavior: RM ? "auto" : "smooth", block: "start" }); };

/* ----- Trang chặng ----- */
function Lesson(n, step) {
  const c = CH[n - 1];
  const stepper = "<ol class=\"stepper\">" + STEPS.map((s, i) => "<li><a href=\"#" + c.hash + s[1] + "\"" + (s[0] === step ? " aria-current=\"step\"" : "") + "><span class=\"sn\">" + (i + 1) + "</span><span>" + s[2] + "<small>" + s[3] + "</small></span></a></li>").join("") + "</ol>";
  const toc = step === "doc" ? c.topics.map(t => ["tp-" + t.id, t.title]) : step === "thuc-hanh" ? c.practice.map((p, i) => ["pr-" + i, p.title]) : step === "ket-qua" ? [["rs-diem", "Điểm số"], ["rs-loi-giai", "Giải thích từng câu"]] : [["race", "Cuộc đua"]];
  const tocH = toc.length < 2 ? "" : "<details open><summary>Mục lục</summary><nav class=\"toc\" aria-label=\"Mục lục\">" + toc.map(t => "<a href=\"#\" data-act=\"toc\" data-id=\"" + t[0] + "\">" + t[1] + "</a>").join("") + "</nav></details>";
  let body = "";
  if (step === "doc") {
    body = co("tip", "Sau chặng này bạn sẽ", "<br>" + c.outcomes.map(o => "• " + o).join("<br>")) +
      c.topics.map(t => "<section class=\"topic\" id=\"tp-" + t.id + "\"><h2>" + t.title + "</h2><div class=\"prose\">" + t.body.map((b, bi) => blk(n, t.id, bi, b)).join("") + "</div></section>").join("") +
      nextBar("Đọc xong? Sang bài thực hành để vận dụng ngay.", c.hash + "-thuc-hanh", "Làm bài thực hành");
  } else if (step === "thuc-hanh") {
    body = "<div class=\"prose\"><p>Có " + c.practice.length + " bài tập ứng dụng. Bạn nhận phản hồi ngay sau mỗi câu trả lời và có thể làm lại.</p></div>" + c.practice.map((p, i) => practiceHTML(n, i)).join("") + nextBar("Sẵn sàng chưa? Vào đường đua để kiểm tra kiến thức.", c.hash + "-kiem-tra", "Đến vạch xuất phát");
  } else if (step === "kiem-tra") body = RaceShell(n);
  else body = Results(n);
  return "<div class=\"wrap\"><div class=\"lesson\"><aside class=\"rail\"><div><h4>Chặng " + n + "</h4>" + stepper + "</div>" + tocH + "</aside><div><header class=\"lh" + (step === "kiem-tra" ? " compact" : "") + "\"><span class=\"plate\">" + c.no + "</span><div><span class=\"eyebrow\">Buổi " + n + " · " + c.min + " phút</span><h1>" + c.title + "</h1><p>" + c.goal + "</p></div></header>" + body + "</div></div></div>";
}

/* ----- Khung cuộc đua (trò chơi gắn vào sau khi dựng) ----- */
function RaceShell(n) {
  return "<div class=\"race\" id=\"race\"><section class=\"pit asphalt\" id=\"pit\"></section><div class=\"cvw\"><div class=\"cv\"><canvas id=\"gc\" aria-label=\"Đường đua\"></canvas><div class=\"cv-ov\" id=\"ov\"></div></div>" +
    "<div class=\"ctrls\"><button class=\"btn\" id=\"bL\" aria-label=\"Sang làn trái\">◀ Trái</button><button class=\"btn\" id=\"bR\" aria-label=\"Sang làn phải\">Phải ▶</button><button class=\"btn primary\" id=\"bGo\">Chốt</button></div><div class=\"row\"><button class=\"btn sm ghost\" id=\"bPause\">Tạm dừng</button></div></div>" +
    "<div class=\"gopts\" id=\"gopts\" role=\"group\" aria-label=\"Các đáp án\"></div><section class=\"tower asphalt\" id=\"tower\"></section>" +
    "<div class=\"help\"><p><b>Cách chơi.</b> Chọn làn có đáp án đúng bằng phím <kbd>←</kbd> <kbd>→</kbd> hoặc <kbd>1</kbd> đến <kbd>4</kbd>, vuốt trên đường đua, hoặc bấm vào đáp án. Nhấn <kbd>Space</kbd> hay nút “Chốt” để tăng tốc về cổng. Mỗi chặng có 10 câu, mỗi câu 10 điểm.</p><label><input type=\"checkbox\" id=\"relax\"" + (RM ? " checked" : "") + "> Chế độ thong thả: cổng dừng lại chờ đến khi bạn chốt</label></div></div>";
}
function onRaceDone(n, r) { S.res[n] = r; go(CH[n - 1].hash + "-ket-qua"); }

/* ----- Kết quả và giải thích ----- */
const RMSG = ["Bạn đã làm chủ chặng này.", "Chỉ cần xem lại vài câu là lên hạng nhất.", "Hãy đọc lại các mục bị sai rồi đua lại.", "Bạn đã về đích. Hãy đọc lại các mục gợi ý bên dưới rồi đua lại."];
function Results(n) {
  const c = CH[n - 1], r = S.res[n];

      c.fillStyle = col; c.fillRect(x - pw / 2, by + 8 * s, pw, ph);
      c.fillStyle = "#14171C"; c.font = "800 " + Math.max(6, 40 * s) + "px " + FONT; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText(tx, x, by + 8 * s + ph / 2 + 1);
    }
  }
  function drawFinish(c) {
    const z = G.fin.z;
    for (let r = 0; r < 2; r++) {
      const zn = z + 1.5 * r, zf = z + 1.5 * (r + 1); if (zn < C * 0.9) continue;
      const tn = C / zn, tf = C / zf, yn = YH + (H - YH) * tn, yf = YH + (H - YH) * tf, hn = RW * tn, hf = RW * tf;
      for (let k = 0; k < 12; k++) { c.fillStyle = (k + r) % 2 ? "#14171C" : "#fff"; const a = -1 + k / 6, b = -1 + (k + 1) / 6; c.beginPath(); c.moveTo(CX + a * hn, yn); c.lineTo(CX + b * hn, yn); c.lineTo(CX + b * hf, yf); c.lineTo(CX + a * hf, yf); c.closePath(); c.fill(); }
    }
  }
  function drawCar(c) {
    const x = CX + G.px * RW * TOPT, tilt = G.spin > 0 ? Math.sin(G.spin * 16) * 0.6 * G.spin : Math.max(-0.2, Math.min(0.2, (laneN(G.lane, G.nl) - G.px) * 0.35));
    c.save(); c.translate(x, CARY); c.rotate(tilt); c.scale(0.95, 0.95);
    c.fillStyle = "rgba(0,0,0,.4)"; c.beginPath(); c.ellipse(0, 2, 38, 7, 0, 0, 7); c.fill();
    c.fillStyle = "#0F1115"; rr(c, -36, -34, 15, 34, 4); rr(c, 21, -34, 15, 34, 4);
    c.fillStyle = "#FFC400"; c.beginPath(); c.moveTo(-22, -4); c.lineTo(-15, -42); c.lineTo(15, -42); c.lineTo(22, -4); c.closePath(); c.fill();
    c.fillStyle = "#14171C"; rr(c, -7, -54, 14, 16, 3); c.fillRect(-32, -58, 64, 8); c.fillRect(-34, -64, 4, 18); c.fillRect(30, -64, 4, 18);
    c.fillStyle = "#fff"; c.fillRect(-8, -33, 16, 12); c.fillStyle = "#14171C"; c.font = "800 14px " + FONT; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("01", 0, -26);
    c.fillStyle = "#FF5B4F"; c.fillRect(-5, -9, 10, 4);
    if (G.v > 28 && !RM) { c.fillStyle = "#FF8A2B"; c.beginPath(); c.moveTo(-6, 0); c.lineTo(6, 0); c.lineTo(0, 16 + Math.random() * 10); c.closePath(); c.fill(); }
    c.restore();
  }
  return { start: start, destroy: destroy };
})();
